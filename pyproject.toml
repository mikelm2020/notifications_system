[project]
name = "notifications-system"
version = "1.0.0"
description = "Sistema de notificaciones multi-canal para Django"
authors = [
    {name = "Miguel Angel López Monroy", email = "miguel.lopezm.dev@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
keywords = ["django", "notifications", "email", "sms", "push", "whatsapp", "slack", "telegram"]
classifiers = [
    "Framework :: Django :: 5.0",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Email",
]

dependencies = [
    "django (>=5.0,<6.0)",
    "djangorestframework (>=3.16.1,<4.0.0)",
    "celery (>=5.5.3,<6.0.0)",
    "redis (>=7.1.0,<8.0.0)",
    "httpx (>=0.27.0,<1.0.0)",
]

[project.optional-dependencies]
# Canales individuales
sms = ["twilio (>=9.0.0,<10.0.0)"]
whatsapp = ["twilio (>=9.0.0,<10.0.0)"]
push-fcm = ["firebase-admin (>=6.0.0,<7.0.0)"]
push-web = ["pywebpush (>=2.0.0,<3.0.0)"]
slack = ["slack-sdk (>=3.0.0,<4.0.0)"]
websocket = ["channels (>=4.0.0,<5.0.0)", "channels-redis (>=4.0.0,<5.0.0)"]

# Grupos de canales
twilio = ["twilio (>=9.0.0,<10.0.0)"]
push = [
    "firebase-admin (>=6.0.0,<7.0.0)",
    "pywebpush (>=2.0.0,<3.0.0)",
]

# Todos los canales
all = [
    "twilio (>=9.0.0,<10.0.0)",
    "firebase-admin (>=6.0.0,<7.0.0)",
    "pywebpush (>=2.0.0,<3.0.0)",
    "slack-sdk (>=3.0.0,<4.0.0)",
    "channels (>=4.0.0,<5.0.0)",
    "channels-redis (>=4.0.0,<5.0.0)",
]

# Desarrollo
dev = [
    "pytest (>=8.0.0,<9.0.0)",
    "pytest-django (>=4.0.0,<5.0.0)",
    "pytest-cov (>=5.0.0,<6.0.0)",
    "black (>=24.0.0)",
    "ruff (>=0.4.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "notifications_system.local"
python_files = ["test_*.py"]
